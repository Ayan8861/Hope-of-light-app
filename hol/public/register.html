<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join us — Hope of Light</title>
<meta name="description" content="Hope of Light is a non-profit bringing education, healthcare and sustainable development to communities in need.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1c3a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body data-page="register">
<div id="app-header"></div>
<main class="auth"><div class="auth-card">
  <h2 class="center">Join our community</h2><p class="muted center">Create an account to volunteer, track your donations and stay connected.</p>
  <form id="regForm" novalidate>
    <div class="field"><label>Full name</label><input class="input" name="name" autocomplete="name"><div class="msg"></div></div>
    <div class="field"><label>Email</label><input class="input" name="email" type="email" autocomplete="email"><div class="msg"></div></div>
    <div class="field"><label>Phone number</label><input class="input" name="phone" type="tel" autocomplete="tel" placeholder="10-digit mobile"><div class="msg"></div></div>
    <div class="row2"><div class="field"><label>Password</label><input class="input" name="password" type="password" autocomplete="new-password" placeholder="Min. 8 characters"><div class="msg"></div></div>
    <div class="field"><label>Confirm</label><input class="input" name="confirm" type="password" autocomplete="new-password"><div class="msg"></div></div></div>
    <div class="field"><label>Your interest (optional)</label><select class="input" name="interest"><option value="">Choose…</option><option>Volunteering</option><option>Donating</option><option>Education</option><option>Healthcare</option><option>Community development</option><option>Women empowerment</option></select></div>
    <div class="alert" id="regAlert"></div>
    <button class="btn btn-blue btn-block" type="submit">Create account</button>
  </form>
  <p class="center muted" style="margin:1.2rem 0 0">Already a member? <a href="/login.html"><b>Log in</b></a></p>
</div></main>
<div id="app-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
