<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Hope of Light</title>
<meta name="description" content="Hope of Light is a non-profit bringing education, healthcare and sustainable development to communities in need.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f1c3a">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body data-page="contact">
<div id="app-header"></div>
<main>
<div class="banner"><div class="wrap"><span class="eyebrow">Contact</span><h1>Get in touch</h1><p>We'd love to hear from you. Send a message and we'll respond as soon as we can.</p></div></div>
<section><div class="wrap split" style="align-items:start">
  <div id="contactInfo"></div>
  <form class="panel" id="contactForm" novalidate>
    <div class="row2"><div class="field"><label>Full name</label><input class="input" name="name" placeholder="Your name"><div class="msg"></div></div>
    <div class="field"><label>Email</label><input class="input" name="email" type="email" placeholder="you@example.com"><div class="msg"></div></div></div>
    <div class="field"><label>Subject</label><input class="input" name="subject" placeholder="What's this about?"><div class="msg"></div></div>
    <div class="field"><label>Message</label><textarea class="input" name="message" rows="5" placeholder="Write your message…"></textarea><div class="msg"></div></div>
    <div class="alert" id="contactAlert"></div>
    <button class="btn btn-blue btn-block" type="submit">Send message</button>
  </form>
</div></section>
</main>
<div id="app-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
